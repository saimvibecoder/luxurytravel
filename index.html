  --paper:#f3f2f2; --ink:#232323; --white:#ffffff;
  --display:"Anton","Bebas Neue","Impact","Haettenschweiler","Arial Narrow Bold",sans-serif;
  --body:"Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:light;
}
html{box-sizing:border-box}
html,body{height:100%}
*{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--sky-5);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.stage{min-height:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:clamp(16px,3.2vw,56px);
  padding-block:48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  position:relative;isolation:isolate;overflow:hidden}
.stage::before{content:"";position:absolute;inset:-20%;z-index:-1;
  background:
    radial-gradient(60% 50% at 18% 8%, var(--sky-1) 0%, transparent 70%),
    radial-gradient(55% 45% at 78% 22%, var(--sky-3) 0%, transparent 72%),
    linear-gradient(172deg, var(--sky-1) 0%, var(--sky-2) 30%, var(--sky-3) 55%, var(--sky-4) 78%, var(--sky-5) 100%);
  animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(-2%,-1%,0) scale(1)}to{transform:translate3d(2%,1.5%,0) scale(1.06)}}

/* Phone frame */
.phone{--w:min(390px,29vw,calc((100svh - 96px) * .462));width:var(--w);aspect-ratio:390/844;position:relative;flex:none;
  border-radius:calc(var(--w)*.135);overflow:hidden;background:var(--paper);
  box-shadow:0 30px 60px -20px rgba(20,16,50,.45);container-type:inline-size}
.island{position:absolute;top:2.9cqw;left:50%;translate:-50% 0;width:31cqw;height:9.4cqw;border-radius:99px;background:#000;z-index:30;pointer-events:none}
.status{position:absolute;inset:0 0 auto;height:12cqw;padding:0 9.5cqw 0 12cqw;display:flex;align-items:center;justify-content:space-between;z-index:25;
  font:600 4.2cqw/1 -apple-system,"SF Pro Text",var(--body);letter-spacing:-.01em;pointer-events:none;padding-top:1.4cqw;color:var(--ink);transition:color .4s}
.status svg{height:3.1cqw;width:auto;display:block}
.status .icons{display:flex;gap:1.6cqw;align-items:center}
.homebar{position:absolute;bottom:2.2cqw;left:50%;translate:-50% 0;width:35cqw;height:1.25cqw;border-radius:9px;background:rgba(0,0,0,.25);z-index:25;pointer-events:none}
.phone[data-screen="detail"] .status{color:#fff}
.phone[data-screen="detail"] .homebar{background:rgba(255,255,255,.75)}

/* Screens */
.screen{position:absolute;inset:0;transition:transform .9s cubic-bezier(.65,0,.25,1), filter .9s ease}
.home{background:var(--paper);padding:9cqw 0 5cqw;box-sizing:border-box;display:flex;flex-direction:column;gap:5cqw}
/* Circle reveal: the offer page grows from the tapped button (--cx/--cy) and shrinks back into it */
.detail{color:#fff;background:var(--tint,#4b7a81);--cx:50%;--cy:80%;--r:160%;
  clip-path:circle(0px at var(--cx) var(--cy));pointer-events:none;visibility:hidden;
  transition:clip-path .85s cubic-bezier(.65,0,.25,1),visibility 0s linear .85s}
.phone:is([data-screen="detail"],[data-screen="plan"]):not([data-custom]) .detail,.phone[data-screen="plan"] .plan{clip-path:circle(var(--r) at var(--cx) var(--cy));pointer-events:auto;visibility:visible;
  transition:clip-path .9s cubic-bezier(.65,0,.25,1),visibility 0s}
.plan{color:#fff;background:var(--tint,#4b7a81);--cx:50%;--cy:80%;--r:160%;z-index:3;
  clip-path:circle(0px at var(--cx) var(--cy));pointer-events:none;visibility:hidden;
  transition:clip-path .85s cubic-bezier(.65,0,.25,1),visibility 0s linear .85s}
.phone:is([data-screen="detail"],[data-screen="plan"]) .home{transform:scale(.92);filter:brightness(.6) blur(2px)}
.phone[data-screen="plan"] .detail{filter:brightness(.7)}
.detail{transition:clip-path .85s cubic-bezier(.65,0,.25,1),visibility 0s linear .85s,filter .8s ease}
.detail .bg{transition:scale 1.2s cubic-bezier(.2,.7,.2,1)}
.phone[data-screen="home"] .detail .bg{scale:1.25}
.detail .nav,.detail .title h1,.detail .title .mark,.detail .facts{transition:opacity .6s ease,translate .8s cubic-bezier(.2,.7,.2,1)}
.phone:is([data-screen="detail"],[data-screen="plan"]) .detail .nav{transition-delay:.45s}
.phone:is([data-screen="detail"],[data-screen="plan"]) .detail .title h1{transition-delay:.35s}
.phone:is([data-screen="detail"],[data-screen="plan"]) .detail .title .mark{transition-delay:.52s}
.phone:is([data-screen="detail"],[data-screen="plan"]) .detail .facts{transition-delay:.55s}
.phone[data-screen="home"] .detail :is(.nav,.title h1,.title .mark,.facts){opacity:0;translate:0 6cqw}
.ripple{position:absolute;z-index:40;pointer-events:none;border-radius:50%;border:2px solid #fff;width:10cqw;height:10cqw;translate:-50% -50%;animation:ripple .7s ease-out forwards}
@keyframes ripple{from{opacity:.9;scale:.3}to{opacity:0;scale:3.2}}

.mega{font-family:var(--display);font-weight:400;text-transform:uppercase;color:var(--ink);margin:0;
  font-size:min(17.6cqw,8.4svh);line-height:.92;letter-spacing:0;text-align:center;white-space:nowrap;padding:0 4cqw;
  transform:scaleY(1.06);transform-origin:top;overflow:hidden}
.mega span{display:block}

/* Destination rail */
.rail{flex:1;min-height:0;display:flex;gap:3.2cqw;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
  padding:0 6.2cqw;scroll-padding:0 6.2cqw;margin:0;list-style:none;overscroll-behavior-x:contain}
.rail::-webkit-scrollbar{display:none}
.rail li{flex:0 0 87.6cqw;scroll-snap-align:start;display:flex;position:relative}
.card{position:relative;flex:1;border-radius:4.4cqw;overflow:hidden;background:var(--tint);
  transform:perspective(900px) rotateY(calc(var(--p,0) * -18deg)) scale(calc(1 - var(--ap,0) * .12));
  transform-origin:calc(50% + var(--p,0) * 70%) 50%;filter:brightness(calc(1 - var(--ap,0) * .25));will-change:transform}
/* Swipe transition: each card reads its offset from centre (--p, -1..1) set on scroll */
.card .copy{opacity:calc(1 - var(--ap,0) * 1.1);translate:calc(var(--p,0) * 26cqw) 0}
.card .copy h2{translate:calc(var(--p,0) * 10cqw) 0}
.card .where,.card .mark{opacity:calc(1 - var(--ap,0) * 1.4)}
.count [data-idx]{display:inline-block}
.count [data-idx].tick-up{animation:tickUp .45s cubic-bezier(.2,.7,.2,1)}
.count [data-idx].tick-down{animation:tickDown .45s cubic-bezier(.2,.7,.2,1)}
@keyframes tickUp{from{opacity:0;translate:0 70%}}
@keyframes tickDown{from{opacity:0;translate:0 -70%}}
.card .photo{position:absolute;inset:0 -18% auto -18%;height:64%;translate:calc(var(--p,0) * 24%) 0;background-image:var(--img);background-size:cover;background-position:var(--pos,center 60%);animation:breathe 14s ease-in-out infinite alternate}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,transparent 30%,color-mix(in srgb,var(--tint) 25%,transparent) 45%,color-mix(in srgb,var(--tint) 92%,transparent) 64%,var(--tint) 100%)}
@keyframes breathe{to{transform:scale(1.06)}}
.card .mark{position:absolute;top:5cqw;left:5cqw;width:6cqw;z-index:2;color:#fff}
.card .where{position:absolute;top:5.2cqw;right:5cqw;z-index:2;color:#fff;font:700 2.9cqw/1 var(--body);letter-spacing:.1em;text-transform:uppercase;
  padding:1.8cqw 2.8cqw;border-radius:99px;background:rgba(0,0,0,.22);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.card .copy{position:absolute;left:6.2cqw;right:6.2cqw;bottom:6.2cqw;z-index:2;color:#fff}
.card h2{font:400 8.6cqw/1.18 var(--body);margin:0 0 4.4cqw;letter-spacing:-.005em}
.card p{font-size:3.7cqw;line-height:1.6;margin:0 0 3.6cqw;opacity:.9}
.pill{appearance:none;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:3.4cqw;height:10.6cqw;padding:0 4.4cqw;border-radius:99px;
  background:linear-gradient(90deg,#f9cfd3 0%,#fbe9ea 32%,#fff 48%,#bfe7f6 70%,#7fd0f2 100%);color:#2c2c3a;
  font:700 3.2cqw/1 var(--body);letter-spacing:.09em;text-transform:uppercase;transition:transform .2s ease, box-shadow .2s ease}
.pill:hover{transform:translateY(-1px);box-shadow:0 6px 18px -6px rgba(127,208,242,.9)}
.pill:active{transform:scale(.97)}
.pill svg{width:3.8cqw;height:3.8cqw}

.railbar{display:flex;align-items:center;justify-content:space-between;padding:0 6.2cqw;margin-bottom:3cqw}
.count{font:400 5.4cqw/1 var(--display);color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.count small{font-size:3.6cqw;opacity:.45}
.dots{display:flex;gap:1.6cqw}
.dots i{width:1.6cqw;height:1.6cqw;border-radius:9px;background:rgba(35,35,35,.2);transition:width .3s,background .3s}
.dots i.on{width:5cqw;background:var(--ink)}
.arrows{display:flex;gap:2cqw}
.arrows button{appearance:none;width:9cqw;height:9cqw;border-radius:50%;border:1.5px solid rgba(35,35,35,.18);background:none;color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0}
.arrows button:hover{background:#fff}
.arrows svg{width:4cqw;height:4cqw}

/* Detail */
.detail .bg{position:absolute;inset:0;background-image:var(--img);background-size:cover;background-position:var(--dpos,center);transform-origin:50% 60%;animation:breathe 16s ease-in-out infinite alternate}
.detail .bg::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.28) 0%,rgba(0,0,0,.1) 25%,transparent 45%,color-mix(in srgb,var(--tint) 15%,transparent) 58%,color-mix(in srgb,var(--tint) 88%,transparent) 72%,var(--tint) 88%)}
.scroller{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;z-index:2}
.scroller::-webkit-scrollbar{display:none}
.page{min-height:100%;box-sizing:border-box;position:relative;display:flex;flex-direction:column;padding:8cqw 6.5cqw calc(10cqw + env(safe-area-inset-bottom,0px))}
.page .nav{position:relative;top:auto;left:auto;right:auto}
.nav{position:absolute;top:8cqw;left:6.5cqw;right:6.5cqw;display:flex;justify-content:space-between;z-index:3}
.icon-btn{appearance:none;background:none;border:0;color:#fff;padding:1.5cqw;margin:-1.5cqw;cursor:pointer;border-radius:2cqw;line-height:0}
.icon-btn svg{width:5.4cqw;height:5.4cqw}
.title{margin:7cqw -2.5cqw 0;text-align:center}
.title h1{font-family:var(--display);font-weight:400;margin:0;font-size:var(--fs,15.2cqw);line-height:.94;letter-spacing:-.015em;text-transform:uppercase;
  transform:scaleY(1.06);text-shadow:0 2px 18px rgba(0,0,0,.18)}
.title .by{margin-top:4.2cqw;display:flex;justify-content:center;align-items:baseline;gap:1.6cqw}
.title .by small{font:600 3.6cqw/1 var(--body)}
.title .by b{font:400 6.4cqw/1 var(--display);text-transform:uppercase;letter-spacing:.005em}
.title .mark{width:7.6cqw;height:7.6cqw;margin:7cqw auto 0;display:block}
.facts{margin-top:auto;padding-top:8cqw}
.picker{display:grid;grid-template-columns:1fr 1fr;gap:0 5cqw;margin:0 0 5.5cqw}
.field{display:flex;flex-direction:column;gap:2.6cqw;min-width:0}
.field .lab{display:flex;align-items:center;justify-content:space-between;gap:2cqw}
.field .lab span{font:700 3cqw/1 var(--body);opacity:.9}
.step{display:flex;gap:1.4cqw}
.step button{appearance:none;width:7.4cqw;height:7.4cqw;border-radius:50%;border:0;cursor:pointer;color:#fff;padding:0;display:grid;place-items:center;
  background:rgba(255,255,255,.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:background .2s,transform .15s}
.step button:hover{background:rgba(255,255,255,.34)}
.step button:active{transform:scale(.9)}
.step button:disabled{opacity:.3;cursor:default}
.step svg{width:3.6cqw;height:3.6cqw}
.field output{font:400 10.2cqw/1 var(--display);text-transform:uppercase;letter-spacing:.005em;white-space:nowrap;font-variant-numeric:tabular-nums}
.field output.bump{animation:bump .35s ease}
@keyframes bump{40%{transform:translateY(-1.2cqw);opacity:.6}}
.cta{appearance:none;border:0;cursor:pointer;margin-top:5cqw;width:100%;height:13cqw;border-radius:99px;display:flex;align-items:center;justify-content:center;gap:2.4cqw;
  background:linear-gradient(90deg,#f9cfd3 0%,#fbe9ea 32%,#fff 48%,#bfe7f6 70%,#7fd0f2 100%);color:#2c2c3a;font:700 3.5cqw/1 var(--body);letter-spacing:.09em;text-transform:uppercase;transition:transform .2s, box-shadow .2s}
.cta:hover{box-shadow:0 8px 24px -8px rgba(127,208,242,.9)}
.cta:active{transform:scale(.98)}
.cta svg{width:4.4cqw;height:4.4cqw}
.plan .hero{height:78cqw;position:relative;background-image:var(--img);background-size:cover;background-position:var(--dpos,center)}
.plan .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,transparent 35%,color-mix(in srgb,var(--tint) 70%,transparent) 75%,var(--tint) 100%)}
.plan .nav{z-index:2}
.plan .nav .mark{width:6.4cqw;height:6.4cqw;color:#fff}
.hero-txt{position:absolute;left:6.5cqw;right:6.5cqw;bottom:2cqw;z-index:2}
.hero-txt small{font:700 3cqw/1 var(--body);letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.hero-txt h2{font:400 13cqw/.95 var(--display);text-transform:uppercase;margin:2.4cqw 0 0;transform:scaleY(1.06);transform-origin:bottom}
.plan .hero-txt,.plan .more{transition:opacity .6s ease .45s,translate .8s cubic-bezier(.2,.7,.2,1) .45s}
.phone:not([data-screen="plan"]) .plan :is(.hero-txt,.more){opacity:0;translate:0 6cqw}
.chips button{appearance:none;border:0;cursor:pointer;font:700 3cqw/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:2.2cqw 3.2cqw;border-radius:99px;background:none;color:#fff;text-decoration:underline;text-underline-offset:3px}
.facts p{margin:0;font-size:3.5cqw;line-height:1.62;opacity:.92;max-width:80cqw;min-height:calc(3.5cqw*1.62*3)}

.more{background:var(--tint);padding:4cqw 6.5cqw calc(14cqw + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:5.5cqw}
.more h3{font:400 8cqw/1 var(--display);text-transform:uppercase;margin:0}
.more .lead{margin:-3cqw 0 0;font-size:3.5cqw;line-height:1.55;opacity:.85}
.chips{display:flex;flex-wrap:wrap;gap:2cqw}
.custom-only{display:none}
.plan.is-custom .custom-only{display:flex;flex-direction:column;gap:4cqw}
.plan.is-custom [data-chips]{display:none}
.num{display:flex;align-items:center;gap:1.6cqw}
.num input{text-align:center;padding-inline:1cqw;-moz-appearance:textfield}
.num input::-webkit-outer-spin-button,.num input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num button{appearance:none;flex:none;width:9cqw;height:9cqw;border-radius:50%;border:0;cursor:pointer;color:#fff;padding:0;display:grid;place-items:center;background:rgba(255,255,255,.2)}
.num button svg{width:3.6cqw;height:3.6cqw}
.chips span{font:700 3cqw/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:2.2cqw 3.2cqw;border-radius:99px;background:rgba(255,255,255,.16)}
.form{display:flex;flex-direction:column;gap:4cqw}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:3cqw}
.fld{display:flex;flex-direction:column;gap:1.8cqw;min-width:0}
.fld label{font:700 2.9cqw/1 var(--body);letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.fld label i{font-style:normal;opacity:.6;text-transform:none;letter-spacing:0;font-weight:400}
.fld input,.fld select,.fld textarea{appearance:none;-webkit-appearance:none;width:100%;box-sizing:border-box;min-width:0;
  font:400 max(16px,3.8cqw)/1.3 var(--body);color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);
  border-radius:3cqw;padding:3cqw 3.4cqw;outline:none;transition:border-color .2s,background .2s;color-scheme:dark}
.fld textarea{resize:vertical;min-height:20cqw}
.fld select{background-image:linear-gradient(45deg,transparent 50%,#fff 50%),linear-gradient(135deg,#fff 50%,transparent 50%);
  background-position:calc(100% - 4.6cqw) 50%,calc(100% - 3.4cqw) 50%;background-size:1.2cqw 1.2cqw;background-repeat:no-repeat;padding-right:8cqw}
.fld select option{color:#222}
.fld input::placeholder,.fld textarea::placeholder{color:rgba(255,255,255,.5)}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:#fff;background:rgba(255,255,255,.2)}
.fld.bad input{border-color:#ffb4a8;background:rgba(255,120,100,.15)}
.err{font-size:3.1cqw;color:#ffd2c9;min-height:0}
.reserve{appearance:none;border:0;cursor:pointer;min-height:13cqw;padding:3cqw 5cqw;border-radius:99px;background:#fff;color:var(--tint);text-decoration:none;
  font:700 3.5cqw/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:2.4cqw;text-align:center;transition:transform .15s}
.reserve:active{transform:scale(.98)}
.reserve svg{width:5cqw;height:5cqw;color:#25d366}
.reserve.done{background:linear-gradient(90deg,#f9cfd3,#fff 48%,#7fd0f2);color:#2c2c3a}
.note{font-size:3.3cqw;line-height:1.5;opacity:.85;text-align:center;margin:-1cqw 0 0}

/* Menu sheet */
.menu{position:absolute;inset:0;z-index:20;background:rgba(20,24,30,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  display:flex;flex-direction:column;justify-content:center;padding:0 9cqw;gap:3cqw;opacity:0;pointer-events:none;transition:opacity .35s ease}
.menu.open{opacity:1;pointer-events:auto}
.menu a{color:#fff;text-decoration:none;font:400 11cqw/1.05 var(--display);text-transform:uppercase;transition:transform .3s ease;width:max-content}
.menu a:hover{transform:translateX(2cqw)}
.menu .icon-btn{position:absolute;top:8cqw;right:6.5cqw}

button:focus-visible,a:focus-visible{outline:2px solid #7fd0f2;outline-offset:3px}

/* Phone-width: the app itself, full screen */
/* One-app view: phones, narrow windows and short windows. The app keeps phone proportions and centres on the gradient when the window is wider than a phone. */
@media (max-width:760px), (max-height:560px){
  .stage{padding:0;gap:0;display:block;height:100%}
  .phone{--w:100vw;width:min(100%, calc(100svh * .6));height:100%;aspect-ratio:auto;margin:0 auto;border-radius:0;box-shadow:0 0 60px rgba(20,16,50,.35)}
  .phone:not(:first-child){display:none}
  .island,.homebar,.status{display:none}
  .home{padding-top:max(8cqw, env(safe-area-inset-top,0px))}
  .rail,.railbar{padding-left:max(6.2cqw,env(safe-area-inset-left,0px));padding-right:max(6.2cqw,env(safe-area-inset-right,0px))}
  body{overscroll-behavior:none}
  .plan .nav,.menu .icon-btn{top:max(7cqw, env(safe-area-inset-top,0px))}
  .page{padding-top:max(7cqw, env(safe-area-inset-top,0px));padding-left:max(6.5cqw,env(safe-area-inset-left,0px));padding-right:max(6.5cqw,env(safe-area-inset-right,0px))}
  .home{padding-bottom:max(4cqw, env(safe-area-inset-bottom,0px))}
}
/* Short phones (e.g. 360×640, iPhone SE): tighten the first screen */
@media (max-height:700px) and (max-width:760px), (max-height:560px){
  .home{gap:3.5cqw}
  .card h2{font-size:7.6cqw;margin-bottom:3cqw}
  .card p{font-size:3.4cqw;margin-bottom:2.6cqw;line-height:1.45}
  .railbar{margin-bottom:1cqw}
  .title h1{font-size:calc(var(--fs,15.2cqw) * .85)}
  .title .mark{margin-top:5cqw}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>

    ph.querySelector('[data-adj="guests"][data-d="-1"]').disabled=st.guests<=1;
    ph.querySelector('[data-adj="guests"][data-d="1"]').disabled=st.guests>=d.maxG;
    ph.querySelector('[data-adj="days"][data-d="-1"]').disabled=st.days<=d.minD;
    ph.querySelector('[data-adj="days"][data-d="1"]').disabled=st.days>=d.maxD;
    $('[data-chips]').innerHTML=`<span>${d.card[0]}</span><span>${st.guests} ${st.guests===1?'guest':'guests'}</span><span>${st.days} days</span><button type="button" data-go="detail">Change</button>`;
    resetSent();
  }
  function openDest(i){
    const d=D[i];st.i=i;st.guests=d.guests;st.days=d.days;st.custom=false;delete ph.dataset.custom;plan.classList.remove('is-custom');
    [detail,plan].forEach(el=>{el.style.setProperty('--tint',d.tint);el.style.setProperty('--img',`url('${d.dimg}')`);el.style.setProperty('--dpos',d.dpos||'center')});
    $('[data-plan-dest]').textContent=d.card.join(' ');
    const h=$('[data-title]');h.innerHTML=d.title.join('<br>');h.style.setProperty('--fs',fitSize(d.title));
    $('[data-desc]').textContent=d.desc;
    $('[data-lead]').textContent=`Share a few details and we will tailor your ${d.card[0]} escape. Your request opens in WhatsApp, ready to send.`;
    scroller.scrollTop=0;pscroll.scrollTop=0;renderNums();if(typeof refreshLink==='function')refreshLink();
  }
  function openCustom(){
    const d=D.find(x=>x.custom);st.custom=true;ph.dataset.custom='1';plan.classList.add('is-custom');
    plan.style.setProperty('--tint',d.tint);plan.style.setProperty('--img',`url('${d.img}')`);plan.style.setProperty('--dpos','center');
    $('[data-plan-dest]').textContent='Custom escape';
    $('[data-lead]').textContent='A wellness resort, a safari, a private island or somewhere we haven\u2019t listed. Tell us where and how you like to travel, and we will plan it around you.';
    pscroll.scrollTop=0;resetSent();refreshLink();
  }
  // form
  const uid='p'+(phoneSeq++);
  ph.querySelectorAll('[data-f]').forEach(el=>{el.id=uid+'-'+el.dataset.f;el.name=el.dataset.f});
  ph.querySelectorAll('[data-for]').forEach(l=>l.htmlFor=uid+'-'+l.dataset.for);
  const F=k=>$(`[data-f="${k}"]`),wa=$('[data-wa]'),err=$('[data-err]');
  const today=new Date();F('date').min=today.toISOString().slice(0,10);
  function resetSent(){wa.classList.remove('done');wa.querySelector('span').textContent='Request on WhatsApp';$('[data-note]').textContent='Opens WhatsApp with your request filled in. Tap send to deliver it.'}
  function message(){
    const d=D[st.i],v=k=>F(k).value.trim();
    const guests=st.custom?+v('cg')||0:st.guests,days=st.custom?+v('cd')||0:st.days;
    const start=new Date(v('date')+'T00:00:00'),end=new Date(start);end.setDate(end.getDate()+Math.max(1,days)-1);
    const L=['*New trip request*',''];
    if(st.custom)L.push(`*Destination:* ${v('dest')||'(not given)'}`,`*Trip style:* ${v('style')}`);
    else L.push(`*Destination:* ${d.card.join(' ')} (${d.where})`);
    L.push(`*Guests:* ${guests}`,`*Duration:* ${days} days`,
      `*Dates:* ${fmtDate(start)} to ${fmtDate(end)}`,
      `*Occasion:* ${v('occasion')}`,`*Budget per person:* ${v('budget')}`);
    if(v('from'))L.push(`*Flying from:* ${v('from')}`);
    L.push('','*Contact*',`Name: ${v('name')}`,`Phone: ${v('phone')}`);
    if(v('email'))L.push(`Email: ${v('email')}`);
    if(v('notes'))L.push('','*Special requests*',v('notes'));
    return L.join('\n');
  }
  function validate(){
    const probs=[];const mark=(k,bad,msg)=>{F(k).closest('.fld').classList.toggle('bad',bad);if(bad)probs.push(msg)};
    if(st.custom){
      mark('dest',F('dest').value.trim().length<2,'where you would like to go');
      const g=+F('cg').value,dd=+F('cd').value;
      mark('cg',!(g>=1&&g<=30),'guests between 1 and 30');mark('cd',!(dd>=2&&dd<=60),'days between 2 and 60');
    } else ['dest','cg','cd'].forEach(k=>F(k).closest('.fld').classList.remove('bad'));
    mark('name',F('name').value.trim().length<2,'your name');
    mark('phone',F('phone').value.replace(/\D/g,'').length<8,'a phone number with at least 8 digits');
    mark('date',!F('date').value||F('date').value<F('date').min,'a start date from today onwards');
    const em=F('email').value.trim();mark('email',!!em&&!/^\S+@\S+\.\S+$/.test(em),'a valid email, or leave it empty');
    err.textContent=probs.length?'Please add '+probs.join(', ')+'.':'';
    return !probs.length;
  }
  function refreshLink(){wa.href=`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(message())}`}
  $('.form').addEventListener('input',e=>{e.target.closest('.fld')?.classList.remove('bad');resetSent();if(err.textContent)validate();refreshLink()});
  $('.form').addEventListener('submit',e=>e.preventDefault());
  wa.addEventListener('pointerdown',refreshLink);wa.addEventListener('focus',refreshLink);
  wa.addEventListener('click',e=>{
    if(!validate()){e.preventDefault();const b=ph.querySelector('.fld.bad input');b&&b.focus();return}
    refreshLink();
    wa.classList.add('done');wa.querySelector('span').textContent='Opened in WhatsApp';
    $('[data-note]').textContent='Your request is ready in WhatsApp. Tap send there to deliver it.';
  });

  function setOrigin(el,target){
    const pr=ph.getBoundingClientRect(),br=el.getBoundingClientRect();
    const x=br.left+br.width/2-pr.left,y=br.top+br.height/2-pr.top;
    const r=Math.hypot(Math.max(x,pr.width-x),Math.max(y,pr.height-y))+20;
    target.style.setProperty('--cx',x+'px');target.style.setProperty('--cy',y+'px');target.style.setProperty('--r',r+'px');
    const rp=document.createElement('span');rp.className='ripple';rp.style.left=x+'px';rp.style.top=y+'px';ph.append(rp);setTimeout(()=>rp.remove(),800);
  }
  function go(s){
    ph.dataset.screen=s;home.setAttribute('aria-hidden',s!=='home');detail.setAttribute('aria-hidden',s!=='detail');plan.setAttribute('aria-hidden',s!=='plan');menu.classList.remove('open');
  }
  ph.addEventListener('click',e=>{
    const t=e.target.closest('[data-open],[data-custom],[data-cstep],[data-go],[data-menu],[data-next],[data-adj],[data-step-rail]');
    if(!t)return; if(t.tagName==='A')e.preventDefault();
    if(t.dataset.open!==undefined){openDest(+t.dataset.open);setOrigin(t,detail);requestAnimationFrame(()=>go('detail'));return}
    if(t.hasAttribute('data-next')){const btn=t.closest('.menu')?$('.cta'):t;setOrigin(btn,plan);pscroll.scrollTop=0;requestAnimationFrame(()=>go('plan'));return}
    if(t.hasAttribute('data-custom')){openCustom();setOrigin(t,plan);requestAnimationFrame(()=>go('plan'));return}
    if(t.dataset.cstep){const inp=F(t.dataset.cstep);inp.value=Math.max(+inp.min,Math.min(+inp.max,(+inp.value||0)+ +t.dataset.d));inp.dispatchEvent(new Event('input',{bubbles:true}));return}
    if(t.dataset.go){go(t.dataset.go==='detail'&&st.custom?'home':t.dataset.go);return}
    if(t.dataset.stepRail){const it=rail.children,w=it[1].offsetLeft-it[0].offsetLeft;rail.scrollTo({left:Math.round(rail.scrollLeft/w+ +t.dataset.stepRail)*w,behavior:'smooth'});return}
    if(t.hasAttribute('data-menu')){menu.classList.toggle('open');return}
    if(t.dataset.adj){const d=D[st.i],k=t.dataset.adj,dv=+t.dataset.d;
      if(k==='guests')st.guests=Math.max(1,Math.min(d.maxG,st.guests+dv));else st.days=Math.max(d.minD,Math.min(d.maxD,st.days+dv));renderNums(k);refreshLink();return}
  });
  openDest(startDest);go(startScreen);
  return ph;
}
stage.append(makePhone('home',0),makePhone('detail',0),makePhone('plan',0));
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.menu.open').forEach(m=>m.classList.remove('open'))});
})();
</script>

</body>
</html>
